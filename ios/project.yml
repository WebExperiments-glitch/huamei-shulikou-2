# huamei术力口 iOS —— XcodeGen 工程定义
# CI（GitHub Actions macOS runner）用 `xcodegen generate` 生成 .xcodeproj 后 xcodebuild 编译。
# 本地（Windows）无需 .xcodeproj，只维护本项目文件。
name: Huamei
options:
  bundleIdPrefix: com.huamei
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 语言模式（Swift 6 工具链），降低严格并发初次编译失败面
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    SUPPORTS_MACCATALYST: false
    CODE_SIGN_STYLE: Automatic
targets:
  Huamei:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: HuameiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huamei.shulikou
        PRODUCT_NAME: "huamei 术力口"
        MARKETING_VERSION: "0.2.0.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "术力口"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIBackgroundModes: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # 允许访问内置快照中的明文后端（本地/局域网 HTTP 远程库）；上架前按需收紧
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES